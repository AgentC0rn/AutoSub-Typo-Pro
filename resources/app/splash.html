<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>AutoSub Typo Pro</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(155deg, #090c1d 0%, #101736 55%, #1a2858 100%);
      color: #eef3ff;
      font: 13px/1.45 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .wrap {
      height: 100%;
      padding: 20px 22px;
      border: 1px solid rgba(0, 229, 255, 0.38);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-app-region: drag;
    }
    .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 16px; font-weight: 800; letter-spacing: 0.2px; }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00e5ff, #ff6b8b);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.8);
    }
    .cyan { color: #00e5ff; }
    .ver {
      font-size: 11.5px;
      font-weight: 700;
      color: #8b98c7;
      padding: 2px 9px;
      border-radius: 999px;
      border: 1px solid rgba(118, 152, 255, 0.28);
      background: rgba(11, 16, 38, 0.72);
    }
    .mid { display: flex; flex-direction: column; gap: 8px; }
    .status { font-size: 13.5px; font-weight: 600; color: #eef3ff; }
    .sub { font-size: 12px; color: #8b98c7; min-height: 18px; }
    .track {
      height: 7px;
      border-radius: 999px;
      background: rgba(118, 152, 255, 0.16);
      overflow: hidden;
    }
    .bar {
      height: 100%;
      width: 35%;
      border-radius: 999px;
      background: linear-gradient(90deg, #00e5ff, #ff6b8b);
      transition: width .12s;
    }
    .bar.indeterminate {
      width: 38%;
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      -webkit-app-region: no-drag;
    }
    button {
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(118, 152, 255, 0.32);
      background: rgba(17, 24, 54, 0.78);
      color: #eef3ff;
    }
    button:hover { border-color: #00e5ff; color: #00e5ff; }
    button.primary {
      border: none;
      background: linear-gradient(135deg, #00e5ff, #2d8ceb);
      color: #061325;
    }
    button.primary:hover { filter: brightness(1.07); color: #061325; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="brand">
        <span class="dot"></span>
        <span>AutoSub <span class="cyan">Typo</span> PRO</span>
      </div>
      <span id="sp-ver" class="ver">v2.0.1</span>
    </div>

    <div class="mid">
      <div id="sp-status" class="status">Đang kiểm tra bản cập nhật OTA…</div>
      <div class="track"><div id="sp-bar" class="bar indeterminate"></div></div>
      <div id="sp-sub" class="sub">Kết nối GitHub Releases…</div>
    </div>

    <div class="actions">
      <button id="sp-skip" type="button">Bỏ qua, mở ngay</button>
      <button id="sp-install" class="primary" type="button" hidden>Tải &amp; cập nhật</button>
    </div>
  </div>
  <script src="splash.js"></script>
</body>
</html>
